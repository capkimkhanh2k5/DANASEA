services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET:-local-development-payment-webhook-secret-change-me}
      APP_VNPAY_API_URL: ${APP_VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      APP_VNPAY_IP_ADDRESS: ${APP_VNPAY_IP_ADDRESS:-127.0.0.1}
      APP_PAYPAL_MODE: ${APP_PAYPAL_MODE:-sandbox}
      APP_PAYPAL_CLIENT_ID: ${APP_PAYPAL_CLIENT_ID}
      APP_PAYPAL_CLIENT_SECRET: ${APP_PAYPAL_CLIENT_SECRET}
      APP_PAYPAL_WEBHOOK_ID: ${APP_PAYPAL_WEBHOOK_ID:-}
      APP_PAYPAL_BASE_URL: ${APP_PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      APP_PAYPAL_RETURN_URL: ${APP_PAYPAL_RETURN_URL:-http://localhost:3000/payment/success}
      APP_PAYPAL_CANCEL_URL: ${APP_PAYPAL_CANCEL_URL:-http://localhost:3000/payment/cancel}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/payment/vnpay-return}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AI_CLIPROXY_ENABLED: ${AI_CLIPROXY_ENABLED:-true}
      AI_CLIPROXY_BASE_URL: ${AI_CLIPROXY_BASE_URL:-http://host.docker.internal:8318/v1}
      AI_CLIPROXY_API_KEY: ${AI_CLIPROXY_API_KEY:-sk-cliproxy-pbl6-local-key}
      AI_CLIPROXY_MODEL: ${AI_CLIPROXY_MODEL:-gemini-3.5-flash-lite}
      AI_CLIPROXY_FALLBACK_MODEL: ${AI_CLIPROXY_FALLBACK_MODEL:-gpt-oss-120b-medium}
      AI_CLIPROXY_MAX_OUTPUT_TOKENS: ${AI_CLIPROXY_MAX_OUTPUT_TOKENS:-65536}
      AI_CLIPROXY_MAX_INPUT_TOKENS: ${AI_CLIPROXY_MAX_INPUT_TOKENS:-1048576}
      AI_CLIPROXY_FALLBACK_CONTEXT_TOKENS: ${AI_CLIPROXY_FALLBACK_CONTEXT_TOKENS:-131072}
      AI_CLIPROXY_INPUT_SAFETY_TOKENS: ${AI_CLIPROXY_INPUT_SAFETY_TOKENS:-8192}
      AI_QUYET_ENABLED: ${AI_QUYET_ENABLED:-false}
      AI_QUYET_BASE_URL: ${AI_QUYET_BASE_URL:-http://quyet:8091}
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:-}
      AI_QUYET_CONNECT_TIMEOUT: ${AI_QUYET_CONNECT_TIMEOUT:-1s}
      AI_QUYET_READ_TIMEOUT: ${AI_QUYET_READ_TIMEOUT:-3s}
      APP_JWT_ACCESS_TOKEN_MINUTES: ${APP_JWT_ACCESS_TOKEN_MINUTES}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL}
      OPEN_METEO_MARINE_BASE_URL: ${OPEN_METEO_MARINE_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  cli-proxy-api:
    profiles: ["ai"]
    image: eceasy/cli-proxy-api:v8.0.40@sha256:0a0ed62b20fa48ad9a5321cef1fbe98a6c02237827b04ee30ecceb8fb39b36e0
    container_name: cli-proxy-api
    user: "${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIPROXYAPI_PORT:-8318}:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:${CLIPROXYAPI_AG_PORT:-51122}:51121"
    volumes:
      - ./private/cli-proxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cli-proxy/auths:/auths
      - ./private/cli-proxy/static:/CLIProxyAPI/static
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8317' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  quyet:
    profiles: ["ai"]
    build:
      context: ./ai-decision
    restart: unless-stopped
    environment:
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:-}
      QUYET_MODEL_DIR: /models
      QUYET_HOST: 0.0.0.0
      QUYET_CPU_THREADS: ${QUYET_CPU_THREADS:-4}
    volumes:
      - type: bind
        source: ${QUYET_MODEL_DIR:-./ai-decision}
        target: /models
        read_only: true
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres_data:

networks:
  app:
  data:
    internal: false
