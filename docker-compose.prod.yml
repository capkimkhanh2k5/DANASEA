x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: danasea-postgres
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    container_name: danasea-redis
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine@sha256:ddbbe6b99ce941f74f566947463e3f47f99c3bf0fe80d4ee250cf30b942b1800
    container_name: danasea-rabbitmq
    hostname: danasea-rabbitmq
    restart: unless-stopped
    logging: *logging
    volumes:
      - rabbitmq_v4_data:/var/lib/rabbitmq
      - ./private/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./private/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - data
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/capkimkhanh2k5/danasea}-backend:${IMAGE_TAG:-latest}
    restart: "no"
    logging: *logging
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    entrypoint: ["java", "-Dloader.main=com.danasea.backend.tools.DatabaseMigration", "-cp", "app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    command: []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/capkimkhanh2k5/danasea}-backend:${IMAGE_TAG:-latest}
    container_name: danasea-backend
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseG1GC}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CHECKIN_QR_SECRET: ${APP_CHECKIN_QR_SECRET}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET}
      APP_VNPAY_API_URL: ${APP_VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      APP_VNPAY_IP_ADDRESS: ${APP_VNPAY_IP_ADDRESS:-127.0.0.1}
      APP_PAYPAL_MODE: ${APP_PAYPAL_MODE:-sandbox}
      APP_PAYPAL_CLIENT_ID: ${APP_PAYPAL_CLIENT_ID}
      APP_PAYPAL_CLIENT_SECRET: ${APP_PAYPAL_CLIENT_SECRET}
      APP_PAYPAL_WEBHOOK_ID: ${APP_PAYPAL_WEBHOOK_ID:-}
      APP_PAYPAL_BASE_URL: ${APP_PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      APP_PAYPAL_RETURN_URL: ${APP_PAYPAL_RETURN_URL:-http://localhost:3000/payment/success}
      APP_PAYPAL_CANCEL_URL: ${APP_PAYPAL_CANCEL_URL:-http://localhost:3000/payment/cancel}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/payment/vnpay-return}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AI_QUYET_ENABLED: ${AI_QUYET_ENABLED:-true}
      AI_QUYET_BASE_URL: ${AI_QUYET_BASE_URL:-http://quyet:8091}
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:-}
      AI_QUYET_CONNECT_TIMEOUT: ${AI_QUYET_CONNECT_TIMEOUT:-1s}
      AI_QUYET_READ_TIMEOUT: ${AI_QUYET_READ_TIMEOUT:-3s}
      AI_CLIPROXY_ENABLED: "true"
      AI_CLIPROXY_BASE_URL: http://cli-proxy-api:8317/v1
      AI_CLIPROXY_API_KEY: ${AI_CLIPROXY_API_KEY}
      AI_CLIPROXY_MODEL: ${AI_CLIPROXY_MODEL:-gemini-2.5-flash}
      AI_CLIPROXY_FALLBACK_MODEL: ${AI_CLIPROXY_FALLBACK_MODEL:-openai/gpt-oss-120b}
      APP_JWT_ACCESS_TOKEN_MINUTES: ${APP_JWT_ACCESS_TOKEN_MINUTES:-60}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://danasea.tailfc3563.ts.net}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL}
      OPEN_METEO_MARINE_BASE_URL: ${OPEN_METEO_MARINE_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      quyet:
        condition: service_healthy
      cli-proxy-api:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.30.10.3
      data:
      ai:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  quyet:
    image: ${IMAGE_PREFIX:-ghcr.io/capkimkhanh2k5/danasea}-quyet:${IMAGE_TAG:-latest}
    container_name: danasea-quyet
    restart: unless-stopped
    logging: *logging
    environment:
      AI_QUYET_API_KEY: ${AI_QUYET_API_KEY:?Run production.py prepare}
      QUYET_MODEL_DIR: /models
      QUYET_HOST: 0.0.0.0
      QUYET_CPU_THREADS: ${QUYET_CPU_THREADS:-4}
    volumes:
      - type: bind
        source: ${QUYET_MODEL_DIR:?Set the verified Quyet Small model directory}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.40@sha256:0a0ed62b20fa48ad9a5321cef1fbe98a6c02237827b04ee30ecceb8fb39b36e0
    container_name: cli-proxy-api
    user: "${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}"
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8318:8317"
      - "127.0.0.1:8085:8085"
    volumes:
      - ./private/cli-proxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cli-proxy/auths:/auths
      - ./private/cli-proxy/static:/CLIProxyAPI/static
    networks:
      - ai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8317'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/capkimkhanh2k5/danasea}-frontend:${IMAGE_TAG:-latest}
    container_name: danasea-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.30.10.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_v4_data:

networks:
  app:
    name: danasea_edge
    ipam:
      config:
        - subnet: 172.30.10.0/28
          gateway: 172.30.10.1
  ai:
    name: danasea_ai
  data:
    internal: false
