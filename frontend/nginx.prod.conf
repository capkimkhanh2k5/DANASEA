# Only for the dedicated production bridge defined in docker-compose.prod.yml.
log_format danasea_proxy '$remote_addr peer=$realip_remote_addr method=$request_method path=$uri status=$status scheme=$http_x_forwarded_proto';

server {
    listen 8080;

    server_name _;
    server_tokens off;
    set_real_ip_from 172.30.10.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log /dev/stdout danasea_proxy;

    root /usr/share/nginx/html;

    index index.html;

    # Gzip compression for SEO Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://accounts.google.com/gsi/; frame-src 'self' https://accounts.google.com/gsi/; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location ~ ^/(actuator|swagger-ui|v3/api-docs)(/|$) {
        return 404;
    }

    # Dynamic sitemap proxy to backend
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/v1/catalog/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 125s;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
    }

    # Social Media Bot proxy for rich tour sharing previews
    location ~* ^/(tour|experience)/([^/]+)$ {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|ZaloPC|TelegramBot|LinkedInBot|Slackbot|WhatsApp|Discordbot)") {
            proxy_pass http://backend:8080/api/v1/catalog/og/$2;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
