spring:
  application:
    name: backend
  messages:
    basename: i18n/common,i18n/validation,i18n/auth,i18n/booking,i18n/weather,i18n/notification,i18n/ai,i18n/policy
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        starttls.required: true
        ssl.trust: smtp.gmail.com
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      username: ${SPRING_REDIS_USERNAME:}
      password: ${SPRING_REDIS_PASSWORD:}
      connect-timeout: 5s
      timeout: 5s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    execution:
      pool:
        core-size: ${APP_ASYNC_CORE_SIZE:4}
        max-size: ${APP_ASYNC_MAX_SIZE:16}
        queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:200}
      thread-name-prefix: danasea-async-
    scheduling:
      pool:
        size: ${APP_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: danasea-scheduler-

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  booking:
    hold-duration: ${APP_BOOKING_HOLD_DURATION:5m}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  checkin:
    qr-secret: ${APP_CHECKIN_QR_SECRET:danasea-secure-qr-checkin-hmac-sha256-default-key-32bytes-min!}
    opens-before: ${APP_CHECKIN_OPENS_BEFORE:2h}
    closes-after: ${APP_CHECKIN_CLOSES_AFTER:30m}
  payment:
    webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:local-development-payment-webhook-secret-change-me}
    paypal:
      mode: ${APP_PAYPAL_MODE:sandbox}
      client-id: ${APP_PAYPAL_CLIENT_ID}
      client-secret: ${APP_PAYPAL_CLIENT_SECRET}
      webhook-id: ${APP_PAYPAL_WEBHOOK_ID:}
      base-url: ${APP_PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      return-url: ${APP_PAYPAL_RETURN_URL:http://localhost:3000/payment/success}
      cancel-url: ${APP_PAYPAL_CANCEL_URL:http://localhost:3000/payment/cancel}
      exchange-rate:
        api-url: ${APP_PAYPAL_EXCHANGE_RATE_API_URL:https://api.frankfurter.dev/v2/rate/usd/vnd}
        cron: ${APP_PAYPAL_EXCHANGE_RATE_CRON:0 0 20 * * *}
        zone: ${APP_PAYPAL_EXCHANGE_RATE_ZONE:Asia/Ho_Chi_Minh}
        max-age-days: ${APP_PAYPAL_EXCHANGE_RATE_MAX_AGE_DAYS:3}
        volatility-threshold: ${APP_PAYPAL_EXCHANGE_RATE_VOLATILITY_THRESHOLD:0.03}
        connect-timeout: ${APP_PAYPAL_EXCHANGE_RATE_CONNECT_TIMEOUT:5s}
        read-timeout: ${APP_PAYPAL_EXCHANGE_RATE_READ_TIMEOUT:5s}
    vnpay:
      api-url: ${APP_VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      ip-address: ${APP_VNPAY_IP_ADDRESS:127.0.0.1}
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      pay-url: ${VNPAY_PAY_URL}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}
  http:
    connect-timeout: ${APP_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_HTTP_READ_TIMEOUT:10s}
  rate-limit:
    login-registration:
      capacity: ${APP_AUTH_RATE_LIMIT_CAPACITY:50}
      refill-period: ${APP_AUTH_RATE_LIMIT_REFILL_PERIOD:1m}
    otp:
      capacity: ${APP_OTP_RATE_LIMIT_CAPACITY:1}
      refill-period: ${APP_OTP_RATE_LIMIT_REFILL_PERIOD:1m}
    forgot-password:
      capacity: ${APP_FORGOT_PASSWORD_RATE_LIMIT_CAPACITY:5}
      refill-period: ${APP_FORGOT_PASSWORD_RATE_LIMIT_REFILL_PERIOD:1m}
  scheduler:
    zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    pool-size: ${APP_SCHEDULER_POOL_SIZE:4}
    booking-cleanup-delay: ${APP_BOOKING_CLEANUP_DELAY:1m}
    weather-fetch-rate: ${APP_WEATHER_FETCH_RATE:30m}
    sub-order-completion-delay: ${APP_SUB_ORDER_COMPLETION_DELAY:60s}
  weather:
    monitoring-cron: ${APP_WEATHER_MONITORING_CRON:0 */30 * * * *}
  transactional-email:
    mode: ${APP_TRANSACTIONAL_EMAIL_MODE:off}
    enabled-families: ${APP_TRANSACTIONAL_EMAIL_ENABLED_FAMILIES:}
    live-from-by-family: ${APP_TRANSACTIONAL_EMAIL_LIVE_FROM_BY_FAMILY:}
    live-pilot-recipients: ${APP_TRANSACTIONAL_EMAIL_LIVE_PILOT_RECIPIENTS:}
    public-base-url: ${APP_TRANSACTIONAL_EMAIL_PUBLIC_BASE_URL:https://danasea.tailfc3563.ts.net/}
    capture-sink-email: ${APP_TRANSACTIONAL_EMAIL_CAPTURE_SINK_EMAIL:capture@danasea.vn}
    ops-emails:
      operations: ${APP_TRANSACTIONAL_EMAIL_OPS_OPERATIONS:}
      finance: ${APP_TRANSACTIONAL_EMAIL_OPS_FINANCE:}
      support: ${APP_TRANSACTIONAL_EMAIL_OPS_SUPPORT:}
    worker:
      enabled: ${APP_TRANSACTIONAL_EMAIL_WORKER_ENABLED:false}
      poll-interval-ms: ${APP_TRANSACTIONAL_EMAIL_POLL_INTERVAL_MS:15000}
      lease-duration-seconds: ${APP_TRANSACTIONAL_EMAIL_LEASE_DURATION_SECONDS:120}
      max-attempts: ${APP_TRANSACTIONAL_EMAIL_MAX_ATTEMPTS:4}
      batch-size: ${APP_TRANSACTIONAL_EMAIL_BATCH_SIZE:20}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

open-meteo:
  base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
  marine-url: ${OPEN_METEO_MARINE_BASE_URL:https://marine-api.open-meteo.com}

ai:
  quyet:
    enabled: ${AI_QUYET_ENABLED:false}
    base-url: ${AI_QUYET_BASE_URL:http://127.0.0.1:8091}
    api-key: ${AI_QUYET_API_KEY:}
    connect-timeout: ${AI_QUYET_CONNECT_TIMEOUT:1s}
    read-timeout: ${AI_QUYET_READ_TIMEOUT:3s}
    revision: 233167bba5df61b5375a522bf8a042d8d2189379
  cliproxy:
    enabled: ${AI_CLIPROXY_ENABLED:true}
    base-url: ${AI_CLIPROXY_BASE_URL:http://localhost:8318/v1}
    api-key: ${AI_CLIPROXY_API_KEY:sk-cliproxy-pbl6-local-key}
    model: ${AI_CLIPROXY_MODEL:gemini-3.5-flash-lite}
    fallback-model: ${AI_CLIPROXY_FALLBACK_MODEL:gpt-oss-120b-medium}
    max-output-tokens: ${AI_CLIPROXY_MAX_OUTPUT_TOKENS:65536}
    max-input-tokens: ${AI_CLIPROXY_MAX_INPUT_TOKENS:1048576}
    fallback-context-tokens: ${AI_CLIPROXY_FALLBACK_CONTEXT_TOKENS:131072}
    input-safety-tokens: ${AI_CLIPROXY_INPUT_SAFETY_TOKENS:8192}

danasea:
  payment:
    payos:
      enabled: ${PAYOS_ENABLED:false}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/success}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
    zalopay:
      enabled: ${ZALOPAY_ENABLED:false}
      app-id: ${ZALOPAY_APP_ID:}
      key1: ${ZALOPAY_KEY1:}
      key2: ${ZALOPAY_KEY2:}
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2}
      return-url: ${ZALOPAY_RETURN_URL:http://localhost:3000/payment/success}
      cancel-url: ${ZALOPAY_CANCEL_URL:http://localhost:3000/payment/cancel}
      callback-url: ${ZALOPAY_CALLBACK_URL:}
