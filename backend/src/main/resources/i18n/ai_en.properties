ai.customer.finance_scope=Revenue reports are internal. I can help you check payments for your own orders.
ai.search.results_available=I found matching services. See the list below and select a service to check its details.
ai.tool.unknown=Unknown tool.
ai.tool.failed=The tool could not complete the request.
ai.booking.confirmation=Please confirm the booking details.
ai.booking.out_of_stock=The selected slot or service is sold out. Please choose another date.
ai.booking.too_many_changes=Service details changed too many times. Please start over.
ai.booking.changed=The price or slot changed. Please confirm the new details.
ai.booking.success=Booking confirmed and held successfully.
ai.weather.unavailable=Weather forecast data is temporarily unavailable. Check an official source before making safety decisions.
ai.policy.lookup_required=I cannot provide cancellation or refund policy details without consulting the official policy source. Please ask me to check a specific policy.
ai.system.language=Answer every user-facing response in English.

ai.policy.verified_facts=The details below come from the official backend policy and cancellation preview. Confirm any change separately.
ai.policy.standard=Under the DANASEA platform policy, guests who cancel more than 24 hours in advance receive {0}. At 24 hours or less, the rate is {1}. The platform rate for verified weather or provider cancellations is {2}. Check the booking to confirm its actual eligibility.
ai.policy.order_version=Existing bookings can carry a different policy version. Provide the booking ID to verify the exact refund.
ai.policy.reschedule=Rescheduling is subject to approval, booking status and available departures. Fees can be determined after reviewing the request.
ai.policy.order_preview=Estimated refund of {0} VND ({1}) under this booking policy. This is a preview. No change or refund has been processed.
ai.policy.order_unavailable=The cancellation estimate is unavailable for this ID within the current account. Vendors need the ID of a sub-order belonging to their shop.
ai.policy.dispute_window=You have {0} days from the experience date to file a dispute. You can submit one review for a completed service in your booking. Open the relevant booking to review the service or file a dispute.
ai.policy.vendor_draft_review=Thank you for reporting this. We have received your message and will check the payment and booking details. We will confirm the next steps once the review is complete.
ai.weather.unconfirmed=The forecast is unavailable, so I cannot confirm safe conditions. Check a current forecast for the specific departure before booking.
ai.weather.slot_required=An area forecast is only a guide. To check whether you should go, please specify the service and departure.
ai.weather.briefing=The preparation advice below is based on your booking. Check the departure date and weather notices for each activity.
ai.booking.guide=Find a service for your travel dates and group size. Open the service, select an option and an available departure, and add it to your cart. At checkout, the system rechecks the price and availability before placing a hold. Review the traveler details, select an available payment method, and pay before the hold expires. Check your status and tickets under My Orders.
ai.search.no_matches=No available services matched the criteria and budget you entered. Try another date, activity, or budget.
ai.search.needs_input=I need a few details to narrow the search. Please share the group size, date, or location for a nearby search.
ai.search.partial=The search was incomplete. You can retry or provide a more specific date and criteria.
ai.search.comparison_available=I compared the services you selected. See the price, duration and ratings below.
ai.search.service_quote={0} has an available option for {1} people from {2} VND for the group. Recheck the date, departure and price before booking.
ai.policy.refund_requires_approval=A refund requires review and approval in the booking workflow. I can preview an eligible refund or summarize the evidence for the authorized reviewer.
ai.search.budget_required=I could not read the spending limit. Please provide the amount in VND and whether it applies to the group or each traveler.
ai.policy.version_comparison=For cancellations more than 24 hours ahead (such as 36 hours before departure), the current default policy (STANDARD_24H_V2) refunds 100%. The legacy policy (LEGACY_TIERED_V1) uses tiered rates of 100% (>48h), 70% (24–48h), 30% (2–24h), and 0% (<2h). The system always evaluates each booking against its own stored policy version.
ai.booking.price_changed_flow=When you confirm a booking, the system revalidates live pricing and departure availability. If the price has changed (reason PRICE_CHANGED), it NEVER holds inventory or charges the new price silently; the old card is cancelled and a replacement confirmation card with the updated price is returned (up to 2 re-quotes) for your explicit re-confirmation.
ai.booking.sold_out_flow=Upon confirmation, live slot inventory is rechecked and overbooking is strictly prevented. If no slots remain, the old card is cancelled with status out_of_stock. If another slot is available under the same option, a replacement card with reason SLOT_UNAVAILABLE is returned for your confirmation.
ai.booking.idempotency_flow=Booking confirmation is protected by a Redis distributed lock and durable outcome storage (ai_confirmation_outcomes). Repeated confirmation requests on the same valid card create at most one booking hold and replay the original outcome.
ai.payment.providers_available=DANASEA supports the payment methods currently enabled in the system configuration below (sourced directly from PaymentProviderAvailability / GET /api/payments/providers).
ai.payment.missing_ticket=If payment succeeded but you have not received a ticket, check your order status and QR ticket in My Orders. If the order is still pending or missing a ticket, submit a support request with your order ID so operations can reconcile with the payment gateway. The assistant cannot confirm unverified payments or reissue tickets automatically.
ai.checkin.qr_rules=DANASEA QR tickets are protected by a cryptographic signature (HMAC-SHA256), are valid only within the configured check-in window (opening 2 hours before departure; for shared departures, standard check-in closes 30 minutes before start with a final cutoff 15 minutes before start), and cannot be scanned repeatedly once checked in.
ai.preferences.opt_out=You can inspect and disable personalized recommendations at any time via AI Preference Settings (GET /api/ai/preferences for the current version, then PUT /api/ai/preferences with expectedVersion and enabled = false). When enabled = false, AI stops using your saved interests, wishlists, recently viewed services, and feedback signals.
ai.weather.horizon_limit=Direct marine weather forecasts only cover up to 16 days ahead (and itinerary planning covers up to 14 days), so the system cannot guarantee sea safety 30 days in advance. Please recheck the forecast closer to your departure date before booking.
ai.itinerary.list_available=Here are your saved itineraries numbered for selection or adjustment.
ai.itinerary.history_available=Here are the saved revisions and proposals for your itinerary. Restoring a previous version creates a new proposal and requires live re-validation of price, slot availability, and marine weather before you accept it.
ai.itinerary.proposal_created=I created a new itinerary adjustment proposal against the current itinerary version without altering your active schedule or paid bookings. Review the changes below before accepting.
ai.itinerary.needs_selection=Please select an itinerary from the list below (for example, itinerary #1) or provide its ID so I can continue.
ai.itinerary.version_conflict=The itinerary version changed while processing. Please review the latest itinerary version before submitting a new proposal.
ai.itinerary.preview_created=I generated the itinerary result using current backend inventory and weather safety checks. Review the details, unresolved constraints, and next steps below. Note: an itinerary preview or saved plan does not reserve inventory or process payment.
ai.recommend.consent_used=Personalization scope: ranking used your consented preference/activity signals together with public ratings.
ai.recommend.cold_start=Personalization scope: because saved personalization consent is disabled or absent, ranking relied only on your query criteria, category, and public ratings without private profile or browsing history.
ai.review.citations_header=Verified review citations:
ai.booking.confirmation_ready=I created a booking confirmation card from live option and slot data below. Please review the grouping, party total, and confirm explicitly on the card (no automatic hold or charge was performed).
