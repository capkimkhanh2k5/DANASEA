error.ai_conversation_locale_mismatch=Hội thoại này đang dùng ngôn ngữ khác. Hãy tạo hội thoại mới để đổi ngôn ngữ.
error.ai_moderation_blocked=Yêu cầu của bạn đã bị từ chối do vi phạm chính sách an toàn thông tin.
ai.rate_limit=Bạn đã vượt quá giới hạn yêu cầu. Vui lòng thử lại sau.
ai.moderation.blocked=Tin nhắn vi phạm chính sách an toàn hoặc chứa nội dung chèn lệnh.
ai.timeout=Yêu cầu đang mất quá nhiều thời gian. Vui lòng thử lại.
ai.unavailable=Dịch vụ AI tạm thời không khả dụng. Vui lòng thử lại sau.
ai.customer.finance_scope=Báo cáo doanh thu là dữ liệu nội bộ. Tôi có thể giúp bạn kiểm tra khoản thanh toán cho đơn hàng của mình.
ai.search.results_available=Tôi tìm thấy các dịch vụ phù hợp. Bạn có thể xem danh sách bên dưới và chọn dịch vụ để kiểm tra chi tiết.
ai.tool.unknown=Công cụ không xác định.
ai.tool.failed=Công cụ không thể hoàn thành yêu cầu.
ai.booking.confirmation=Vui lòng xác nhận thông tin đặt dịch vụ.
ai.booking.out_of_stock=Khung giờ hoặc dịch vụ đã hết chỗ. Vui lòng chọn ngày khác.
ai.booking.too_many_changes=Thông tin dịch vụ đã thay đổi quá nhiều lần. Vui lòng bắt đầu lại.
ai.booking.changed=Giá hoặc khung giờ đã thay đổi. Vui lòng xác nhận thông tin mới.
ai.booking.success=Đã xác nhận và giữ chỗ thành công.
ai.weather.unavailable=Dữ liệu dự báo thời tiết tạm thời không khả dụng. Hãy kiểm tra nguồn chính thức trước khi đưa ra quyết định an toàn.
ai.policy.lookup_required=Tôi không thể cung cấp thông tin về chính sách hoàn hủy khi chưa tra cứu hệ thống chính thức. Vui lòng yêu cầu kiểm tra chính sách cụ thể để tôi hỗ trợ.
ai.system.language=Luôn trả lời mọi nội dung dành cho người dùng bằng tiếng Việt.

ai.policy.verified_facts=Các thông tin bên dưới được lấy từ chính sách và dự kiến hủy chính thức của hệ thống. Bạn cần xác nhận riêng trước khi thay đổi đơn.
