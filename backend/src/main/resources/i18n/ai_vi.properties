error.ai_conversation_locale_mismatch=Hội thoại này đang dùng ngôn ngữ khác. Hãy tạo hội thoại mới để đổi ngôn ngữ.
error.ai_moderation_blocked=Yêu cầu của bạn đã bị từ chối do vi phạm chính sách an toàn thông tin.
ai.rate_limit=Bạn đã vượt quá giới hạn yêu cầu. Vui lòng thử lại sau.
ai.moderation.blocked=Tin nhắn vi phạm chính sách an toàn hoặc chứa nội dung chèn lệnh.
ai.timeout=Yêu cầu đang mất quá nhiều thời gian. Vui lòng thử lại.
ai.unavailable=Dịch vụ AI tạm thời không khả dụng. Vui lòng thử lại sau.
ai.customer.finance_scope=Báo cáo doanh thu là dữ liệu nội bộ. Tôi có thể giúp bạn kiểm tra khoản thanh toán cho đơn hàng của mình.
ai.search.results_available=Tôi tìm thấy các dịch vụ phù hợp. Bạn có thể xem danh sách bên dưới và chọn dịch vụ để kiểm tra chi tiết.
ai.tool.unknown=Công cụ không xác định.
ai.tool.failed=Công cụ không thể hoàn thành yêu cầu.
ai.booking.confirmation=Vui lòng xác nhận thông tin đặt dịch vụ.
ai.booking.out_of_stock=Khung giờ hoặc dịch vụ đã hết chỗ. Vui lòng chọn ngày khác.
ai.booking.too_many_changes=Thông tin dịch vụ đã thay đổi quá nhiều lần. Vui lòng bắt đầu lại.
ai.booking.changed=Giá hoặc khung giờ đã thay đổi. Vui lòng xác nhận thông tin mới.
ai.booking.success=Đã xác nhận và giữ chỗ thành công.
ai.weather.unavailable=Dữ liệu dự báo thời tiết tạm thời không khả dụng. Hãy kiểm tra nguồn chính thức trước khi đưa ra quyết định an toàn.
ai.policy.lookup_required=Tôi không thể cung cấp thông tin về chính sách hoàn hủy khi chưa tra cứu hệ thống chính thức. Vui lòng yêu cầu kiểm tra chính sách cụ thể để tôi hỗ trợ.
ai.system.language=Luôn trả lời mọi nội dung dành cho người dùng bằng tiếng Việt.

ai.policy.verified_facts=Các thông tin bên dưới được lấy từ chính sách và dự kiến hủy chính thức của hệ thống. Bạn cần xác nhận riêng trước khi thay đổi đơn.
ai.policy.standard=Theo chính sách chung của DANASEA, khách tự hủy khi còn hơn 24 giờ được hoàn {0}. Khi còn đúng 24 giờ hoặc ít hơn, mức hoàn theo chính sách này là {1}. Nếu chuyến bị hủy do thời tiết hoặc lỗi nhà cung cấp đã xác minh, mức hoàn theo chính sách chung là {2}. Cần kiểm tra đơn để xác định mức thực tế.
ai.policy.order_version=Đơn đã đặt có thể áp dụng phiên bản chính sách khác. Hãy cung cấp mã đơn để kiểm tra mức hoàn chính xác.
ai.policy.reschedule=Đổi lịch cần được xét duyệt theo tình trạng đơn và lịch còn chỗ. Khoản phí chỉ được xác định sau khi kiểm tra yêu cầu.
ai.policy.order_preview=Dự kiến hoàn {0} ₫ ({1}) theo điều kiện của đơn. Đây là kết quả xem trước. Chưa có thay đổi hay giao dịch hoàn tiền.
ai.policy.order_unavailable=Không thể kiểm tra dự kiến hoàn cho mã này trong phạm vi tài khoản hiện tại. Nhà cung cấp cần dùng mã đơn con của gian hàng.
ai.policy.dispute_window=Thời hạn khiếu nại là {0} ngày kể từ ngày trải nghiệm. Bạn có thể gửi một đánh giá cho dịch vụ đã hoàn thành trong đơn của mình. Mở đơn tương ứng để thực hiện đánh giá hoặc gửi khiếu nại.
ai.policy.vendor_draft_review=Chào bạn, cảm ơn bạn đã báo sự cố. Bên mình đã tiếp nhận và sẽ kiểm tra trạng thái thanh toán cùng thông tin đơn. Bên mình sẽ phản hồi về hướng xử lý sau khi có kết quả xác minh.
ai.weather.unconfirmed=Dự báo chưa khả dụng nên chưa thể xác nhận điều kiện an toàn. Hãy kiểm tra lại dự báo còn hiệu lực cho ca cụ thể trước khi đặt.
ai.weather.slot_required=Dự báo khu vực chỉ để tham khảo. Để đánh giá có nên đi hay không, hãy cho biết dịch vụ và ca khởi hành cụ thể.
ai.weather.briefing=Thông tin chuẩn bị đi biển bên dưới được tra từ đơn của bạn. Hãy đối chiếu ngày khởi hành và cảnh báo thời tiết trên từng hoạt động.
ai.booking.guide=Tìm dịch vụ theo ngày và số khách. Mở trang dịch vụ, chọn gói phù hợp và ca còn chỗ, rồi đưa vào giỏ hàng. Khi vào thanh toán, hệ thống kiểm tra lại giá và số chỗ trước khi giữ chỗ. Kiểm tra thông tin khách, chọn phương thức thanh toán đang hiển thị và hoàn tất trước khi lượt giữ chỗ hết hạn. Xem trạng thái đơn và vé trong Đơn hàng của tôi.
ai.search.no_matches=Chưa có dịch vụ còn chỗ đáp ứng các tiêu chí và ngân sách đã nhập. Bạn có thể đổi ngày, hoạt động hoặc ngân sách để tìm lại.
ai.search.needs_input=Cần thêm thông tin để tìm đúng dịch vụ. Hãy cho biết số khách, ngày đi hoặc vị trí nếu bạn muốn tìm quanh mình.
ai.search.partial=Kết quả tìm kiếm chưa đầy đủ. Bạn có thể thử lại hoặc bổ sung ngày đi và tiêu chí.
ai.search.comparison_available=Tôi đã đối chiếu các dịch vụ bạn chọn. Bạn có thể xem giá, thời lượng và đánh giá trong bảng bên dưới.
ai.search.service_quote={0} có gói còn chỗ cho {1} người với giá từ {2} ₫ cho cả nhóm. Kiểm tra lại ngày, ca và giá trước khi đặt.
ai.policy.refund_requires_approval=Yêu cầu hoàn tiền cần được xử lý và phê duyệt trong hồ sơ của đơn. Tôi có thể giúp xem trước mức hoàn dự kiến hoặc tóm tắt bằng chứng để người có thẩm quyền quyết định.
ai.search.budget_required=Tôi chưa đọc được trần ngân sách. Hãy cho biết số tiền bằng đồng Việt Nam và tính cho cả nhóm hay mỗi người.
ai.policy.version_comparison=Với mốc trên 24 giờ (ví dụ 36 giờ trước giờ khởi hành), chính sách mặc định hiện hành (STANDARD_24H_V2) áp dụng mức hoàn 100%. Phiên bản cũ (LEGACY_TIERED_V1) áp dụng các mốc 100% (trên 48 giờ), 70% (từ 24 đến 48 giờ), 30% (từ 2 đến dưới 24 giờ) và 0% (dưới 2 giờ). Hệ thống luôn đối chiếu phiên bản chính sách được lưu riêng trên từng đơn.
ai.booking.price_changed_flow=Khi bạn bấm xác nhận đặt chỗ, hệ thống sẽ tái thẩm định giá và ca khởi hành thời gian thực từ dữ liệu hiện hành. Nếu giá thay đổi (mã lý do PRICE_CHANGED), hệ thống KHÔNG âm thầm giữ chỗ hay thu tiền theo giá mới; thẻ xác nhận cũ sẽ bị hủy và một thẻ xác nhận thay thế với mức giá cập nhật sẽ được tạo (tối đa 2 lần cập nhật lại) để bạn kiểm tra và xác nhận lại.
ai.booking.sold_out_flow=Khi bạn bấm xác nhận, hệ thống luôn kiểm tra tồn chỗ thời gian thực và tuyệt đối không cho đặt vượt quá sức chứa (overbook). Nếu toàn bộ ca của dịch vụ đã hết chỗ, hệ thống trả trạng thái hết chỗ (out_of_stock) và hủy thẻ nháp cũ. Nếu chỉ ca đã chọn hết nhưng còn ca khác cùng gói, hệ thống trả phương án thay thế (SLOT_UNAVAILABLE) để bạn chọn xác nhận lại.
ai.booking.idempotency_flow=Thao tác xác nhận đặt chỗ được bảo vệ bằng khóa phân tán (distributed lock) và bảng lưu kết quả bền vững (ai_confirmation_outcomes). Nếu bạn bấm xác nhận lặp lại cho cùng một thẻ hợp lệ, hệ thống chỉ tạo tối đa một lượt giữ chỗ (hold) và trả lại cùng kết quả xác nhận đó.
ai.payment.providers_available=DANASEA hiện hỗ trợ thanh toán qua các phương thức đang bật trong cấu hình hệ thống bên dưới (đối chiếu trực tiếp từ nguồn PaymentProviderAvailability / GET /api/payments/providers).
ai.payment.missing_ticket=Nếu đã thanh toán thành công nhưng chưa thấy vé, bạn hãy kiểm tra trạng thái đơn hàng và mục Vé QR trong phần Đơn hàng của tôi. Nếu đơn vẫn ở trạng thái chờ hoặc chưa có vé, hãy gửi yêu cầu hỗ trợ kèm mã đơn để bộ phận vận hành đối soát với cổng thanh toán. Hệ thống không tự xác nhận thanh toán thành công hoặc cấp lại vé khi chưa đối soát.
ai.checkin.qr_rules=Vé QR của DANASEA được ký xác thực (chữ ký số HMAC-SHA256), chỉ có hiệu lực trong cửa sổ check-in quy định (mở trước giờ khởi hành 2 giờ; với tour ghép đoàn mốc chuẩn là trước 30 phút và đóng muộn nhất trước giờ khởi hành 15 phút), và không thể quét sử dụng lặp lại nhiều lần sau khi đã ghi nhận check-in.
ai.preferences.opt_out=Bạn có thể xem và tắt cá nhân hóa gợi ý bất cứ lúc nào qua cài đặt sở thích AI (API GET /api/ai/preferences để lấy version hiện tại, sau đó PUT /api/ai/preferences với expectedVersion và enabled = false). Khi enabled = false, hệ thống ngừng sử dụng sở thích đã lưu, danh sách yêu thích, lịch sử xem và tín hiệu phản hồi gợi ý.
ai.weather.horizon_limit=Hệ thống chỉ đánh giá dữ liệu dự báo thời tiết trực tiếp trong phạm vi tối đa 16 ngày tới (và lập lịch trình tối đa 14 ngày), nên không thể bảo đảm an toàn thời tiết cho ngày cách 30 ngày nữa. Bạn vui lòng kiểm tra lại dự báo gần ngày khởi hành trước khi đặt chỗ.
ai.itinerary.list_available=Dưới đây là danh sách các lịch trình bạn đã lưu theo thứ tự đánh số để bạn chọn hoặc yêu cầu điều chỉnh.
ai.itinerary.history_available=Dưới đây là lịch sử các phiên bản (revisions) và đề xuất điều chỉnh (proposals) của lịch trình đã lưu. Để khôi phục về một phiên bản cũ, hệ thống sẽ tạo một đề xuất mới từ phiên bản đó và bắt buộc kiểm tra lại giá, tồn chỗ và thời tiết thời gian thực trước khi bạn bấm chấp nhận.
ai.itinerary.proposal_created=Tôi đã tạo đề xuất điều chỉnh lịch trình (Proposal) mới theo phiên bản hiện tại mà không làm thay đổi lịch gốc hay các đơn đặt chỗ đã thanh toán. Vui lòng xem phần thay đổi bên dưới và chấp nhận nếu đồng ý.
ai.itinerary.needs_selection=Bạn chưa chọn lịch trình cụ thể hoặc mã lịch trình chưa rõ ràng. Hãy chọn một lịch trình từ danh sách bên dưới (ví dụ: lịch trình số 1) để tôi xử lý tiếp.
ai.itinerary.version_conflict=Phiên bản lịch trình đã thay đổi trong lúc xử lý. Vui lòng xem lại dữ liệu lịch trình mới nhất trước khi tạo đề xuất điều chỉnh tiếp theo.
ai.itinerary.preview_created=Tôi đã tổng hợp kết quả lập lịch trình dựa trên dữ liệu và điều kiện an toàn thời tiết thực tế. Bạn có thể xem chi tiết phương án, các ràng buộc chưa giải quyết và bước tiếp theo bên dưới. Lưu ý: phương án lịch trình chưa giữ chỗ tồn kho và chưa thanh toán.
ai.recommend.consent_used=Lưu ý cá nhân hóa: danh sách có sử dụng tín hiệu sở thích/hoạt động đã được bạn cấp quyền (consent đang bật) kết hợp đánh giá công khai.
ai.recommend.cold_start=Lưu ý cá nhân hóa: do bạn chưa bật consent cá nhân hóa hoặc chưa có dữ liệu sở thích riêng, kết quả hiện chỉ xếp hạng theo tiêu chí truy vấn, danh mục và đánh giá công khai (không dùng lịch sử xem hay sở thích cá nhân).
ai.review.citations_header=Trích dẫn đánh giá thực tế:
ai.booking.confirmation_ready=Tôi đã tạo thẻ xác nhận đặt chỗ dựa trên gói dịch vụ và ca khởi hành thực tế bên dưới. Vui lòng kiểm tra thông tin phân nhóm, tổng tiền và bấm xác nhận trực tiếp trên thẻ (hệ thống không tự giữ chỗ hay tự thanh toán).
