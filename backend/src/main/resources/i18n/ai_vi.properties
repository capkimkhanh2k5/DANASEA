error.ai_conversation_locale_mismatch=Hội thoại này đang dùng ngôn ngữ khác. Hãy tạo hội thoại mới để đổi ngôn ngữ.
error.ai_moderation_blocked=Yêu cầu của bạn đã bị từ chối do vi phạm chính sách an toàn thông tin.
ai.rate_limit=Bạn đã vượt quá giới hạn yêu cầu. Vui lòng thử lại sau.
ai.moderation.blocked=Tin nhắn vi phạm chính sách an toàn hoặc chứa nội dung chèn lệnh.
ai.timeout=Yêu cầu đang mất quá nhiều thời gian. Vui lòng thử lại.
ai.unavailable=Dịch vụ AI tạm thời không khả dụng. Vui lòng thử lại sau.
ai.customer.finance_scope=Báo cáo doanh thu là dữ liệu nội bộ. Tôi có thể giúp bạn kiểm tra khoản thanh toán cho đơn hàng của mình.
ai.search.results_available=Tôi tìm thấy các dịch vụ phù hợp. Bạn có thể xem danh sách bên dưới và chọn dịch vụ để kiểm tra chi tiết.
ai.tool.unknown=Công cụ không xác định.
ai.tool.failed=Công cụ không thể hoàn thành yêu cầu.
ai.booking.confirmation=Vui lòng xác nhận thông tin đặt dịch vụ.
ai.booking.out_of_stock=Khung giờ hoặc dịch vụ đã hết chỗ. Vui lòng chọn ngày khác.
ai.booking.too_many_changes=Thông tin dịch vụ đã thay đổi quá nhiều lần. Vui lòng bắt đầu lại.
ai.booking.changed=Giá hoặc khung giờ đã thay đổi. Vui lòng xác nhận thông tin mới.
ai.booking.success=Đã xác nhận và giữ chỗ thành công.
ai.weather.unavailable=Dữ liệu dự báo thời tiết tạm thời không khả dụng. Hãy kiểm tra nguồn chính thức trước khi đưa ra quyết định an toàn.
ai.policy.lookup_required=Tôi không thể cung cấp thông tin về chính sách hoàn hủy khi chưa tra cứu hệ thống chính thức. Vui lòng yêu cầu kiểm tra chính sách cụ thể để tôi hỗ trợ.
ai.system.language=Luôn trả lời mọi nội dung dành cho người dùng bằng tiếng Việt.

ai.policy.verified_facts=Các thông tin bên dưới được lấy từ chính sách và dự kiến hủy chính thức của hệ thống. Bạn cần xác nhận riêng trước khi thay đổi đơn.
ai.policy.standard=Theo chính sách chung của DANASEA, khách tự hủy khi còn hơn 24 giờ được hoàn {0}. Khi còn đúng 24 giờ hoặc ít hơn, mức hoàn theo chính sách này là {1}. Nếu chuyến bị hủy do thời tiết hoặc lỗi nhà cung cấp đã xác minh, mức hoàn theo chính sách chung là {2}. Cần kiểm tra đơn để xác định mức thực tế.
ai.policy.order_version=Đơn đã đặt có thể áp dụng phiên bản chính sách khác. Hãy cung cấp mã đơn để kiểm tra mức hoàn chính xác.
ai.policy.reschedule=Đổi lịch cần được xét duyệt theo tình trạng đơn và lịch còn chỗ. Khoản phí chỉ được xác định sau khi kiểm tra yêu cầu.
ai.policy.order_preview=Dự kiến hoàn {0} ₫ ({1}) theo điều kiện của đơn. Đây là kết quả xem trước. Chưa có thay đổi hay giao dịch hoàn tiền.
ai.policy.order_unavailable=Không thể kiểm tra dự kiến hoàn cho mã này trong phạm vi tài khoản hiện tại. Nhà cung cấp cần dùng mã đơn con của gian hàng.
ai.policy.dispute_window=Thời hạn khiếu nại là {0} ngày kể từ ngày trải nghiệm. Bạn có thể gửi một đánh giá cho dịch vụ đã hoàn thành trong đơn của mình. Mở đơn tương ứng để thực hiện đánh giá hoặc gửi khiếu nại.
ai.policy.vendor_draft_review=Chào bạn, cảm ơn bạn đã báo sự cố. Bên mình đã tiếp nhận và sẽ kiểm tra trạng thái thanh toán cùng thông tin đơn. Bên mình sẽ phản hồi về hướng xử lý sau khi có kết quả xác minh.
ai.weather.unconfirmed=Dự báo chưa khả dụng nên chưa thể xác nhận điều kiện an toàn. Hãy kiểm tra lại dự báo còn hiệu lực cho ca cụ thể trước khi đặt.
ai.weather.slot_required=Dự báo khu vực chỉ để tham khảo. Để đánh giá có nên đi hay không, hãy cho biết dịch vụ và ca khởi hành cụ thể.
ai.weather.briefing=Thông tin chuẩn bị đi biển bên dưới được tra từ đơn của bạn. Hãy đối chiếu ngày khởi hành và cảnh báo thời tiết trên từng hoạt động.
ai.booking.guide=Tìm dịch vụ theo ngày và số khách. Mở trang dịch vụ, chọn gói phù hợp và ca còn chỗ, rồi đưa vào giỏ hàng. Khi vào thanh toán, hệ thống kiểm tra lại giá và số chỗ trước khi giữ chỗ. Kiểm tra thông tin khách, chọn phương thức thanh toán đang hiển thị và hoàn tất trước khi lượt giữ chỗ hết hạn. Xem trạng thái đơn và vé trong Đơn hàng của tôi.
ai.search.no_matches=Chưa có dịch vụ còn chỗ đáp ứng các tiêu chí và ngân sách đã nhập. Bạn có thể đổi ngày, hoạt động hoặc ngân sách để tìm lại.
ai.search.needs_input=Cần thêm thông tin để tìm đúng dịch vụ. Hãy cho biết số khách, ngày đi hoặc vị trí nếu bạn muốn tìm quanh mình.
ai.search.partial=Kết quả tìm kiếm chưa đầy đủ. Bạn có thể thử lại hoặc bổ sung ngày đi và tiêu chí.
ai.search.comparison_available=Tôi đã đối chiếu các dịch vụ bạn chọn. Bạn có thể xem giá, thời lượng và đánh giá trong bảng bên dưới.
ai.search.service_quote={0} có gói còn chỗ cho {1} người với giá từ {2} ₫ cho cả nhóm. Kiểm tra lại ngày, ca và giá trước khi đặt.
ai.policy.refund_requires_approval=Yêu cầu hoàn tiền cần được xử lý và phê duyệt trong hồ sơ của đơn. Tôi có thể giúp xem trước mức hoàn dự kiến hoặc tóm tắt bằng chứng để người có thẩm quyền quyết định.
ai.search.budget_required=Tôi chưa đọc được trần ngân sách. Hãy cho biết số tiền bằng đồng Việt Nam và tính cho cả nhóm hay mỗi người.
