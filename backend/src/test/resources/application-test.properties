# Test profile — Redis and RabbitMQ infrastructure is provided by Testcontainers fixtures

# Each cached Spring context owns its H2 schema; closing one must not drop another's tables.
# PostgreSQL integration suites override the URL through DynamicPropertySource.
spring.datasource.url=
spring.datasource.generate-unique-name=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Valid typed configuration for tests
app.jwt.secret=test-secret-key-for-unit-tests-minimum-256-bits-long-enough
app.jwt.access-token-minutes=60
app.jwt.refresh-token-days=1
app.cors.allowed-origins=http://localhost:3000
app.http.connect-timeout=1s
app.http.read-timeout=2s
app.rate-limit.login-registration.capacity=50
app.rate-limit.login-registration.refill-period=1m
app.rate-limit.otp.capacity=1
app.rate-limit.otp.refill-period=1m
app.scheduler.zone=Asia/Ho_Chi_Minh
app.scheduler.pool-size=2
app.scheduler.enabled=false
app.scheduler.booking-cleanup-delay=1m
app.scheduler.weather-fetch-rate=30m
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.mail.username=test
spring.mail.password=test
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
spring.flyway.enabled=false
spring.main.allow-bean-definition-overriding=true
app.checkin.qr-secret=danasea-secure-qr-checkin-hmac-sha256-default-key-32bytes-min!
app.checkin.opens-before=2h
app.checkin.closes-after=30m
app.payment.webhook-secret=test-payment-webhook-secret-minimum-256-bits-long
app.payment.paypal.mode=sandbox
app.payment.paypal.client-id=test-paypal-client-id
app.payment.paypal.client-secret=test-paypal-client-secret
app.payment.paypal.base-url=https://api-m.sandbox.paypal.com
app.payment.paypal.exchange-rate.api-url=https://api.frankfurter.dev/v2/rate/usd/vnd
app.payment.paypal.exchange-rate.cron=0 0 20 * * *
app.payment.paypal.exchange-rate.zone=Asia/Ho_Chi_Minh
app.payment.paypal.exchange-rate.max-age-days=3
app.payment.paypal.exchange-rate.volatility-threshold=0.03
app.payment.paypal.exchange-rate.connect-timeout=2s
app.payment.paypal.exchange-rate.read-timeout=2s
app.payment.vnpay.tmn-code=test-tmn-code
app.payment.vnpay.hash-secret=test-hash-secret-min-32-chars-long-secret
app.payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.payment.vnpay.return-url=http://localhost:3000/payment/vnpay-return
ai.cliproxy.enabled=false
ai.cliproxy.base-url=http://localhost:8318/v1
ai.cliproxy.api-key=test-cliproxy-key
ai.cliproxy.model=test-gemini-model
ai.cliproxy.fallback-model=test-fallback-model
app.oauth2.google.client-id=test-google-client-id
app.oauth2.google.client-secret=test-google-client-secret
