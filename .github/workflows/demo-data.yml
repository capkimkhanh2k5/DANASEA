name: Demo Data
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, replace application data, or restore a verified demo backup
        type: choice
        options: [inspect, replace, restore]
        default: inspect
      confirmation:
        description: REPLACE_DEMO_DATA or RESTORE_DEMO_DATA for the corresponding action
        required: false
      backup_id:
        description: Verified backup identifier reported by a previous demo operation (restore only)
        required: false
permissions:
  contents: read
concurrency:
  group: cd-production
  cancel-in-progress: false
jobs:
  demo:
    name: Verified server demo operation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Enforce production source and repository controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '::error::Run Demo Data from main'; exit 1; }
          python3 scripts/check_repository_controls.py --repository "$GITHUB_REPOSITORY"
          python3 -B -m unittest discover -s demo_data_handoff/tests -v
      - name: Prepare existing deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.SERVER_TAILSCALE_IP }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          umask 077
          for name in DEPLOY_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER TS_ID TS_SECRET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Sign and dispatch bounded demo request
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_TAILSCALE_IP }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEMO_ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_ID: ${{ inputs.backup_id }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
        run: |
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/demo-request.XXXXXX")
          trap 'rm -rf -- "$private_dir"' EXIT
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=3)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" status > "$private_dir/release.json"
          DEPLOYED_SHA=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$private_dir/release.json")
          [[ "$DEPLOYED_SHA" == "$GITHUB_SHA" ]] || { echo '::error::Deploy this main revision before running Demo Data'; exit 1; }
          PACKAGE_SHA=$(shasum -a 256 demo_data_handoff/MANIFEST.sha256 | cut -d ' ' -f 1)
          python3 scripts/demo_request.py create --action "$DEMO_ACTION" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --package-sha256 "$PACKAGE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --confirmation "$CONFIRMATION" --backup-id "$BACKUP_ID" --output "$private_dir/request.json"
          ssh-keygen -Y sign -f ~/.ssh/id_ed25519 -n danasea-demo-data "$private_dir/request.json"
          password_args=()
          if [[ "$DEMO_ACTION" == replace ]]; then password_args=(--password-env DEMO_USER_PASSWORD); fi
          python3 scripts/demo_request.py envelope --request "$private_dir/request.json" --signature "$private_dir/request.json.sig" "${password_args[@]}" > "$private_dir/envelope.json"
          result=0
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'demo-data '"$GITHUB_SHA" < "$private_dir/envelope.json" > "$private_dir/result.json" || result=$?
          python3 scripts/demo_report.py "$private_dir/result.json" --output "$GITHUB_STEP_SUMMARY"
          exit "$result"
