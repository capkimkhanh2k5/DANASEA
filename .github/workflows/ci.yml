name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and run all mandatory integration tests
        run: ./mvnw -B clean verify
      - name: Reject unexpected skips and missing critical suites
        run: python3 ../scripts/check_test_reports.py target/surefire-reports --policy ../.ci/test-policy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14
  worker:
    name: Quyet worker and pinned CPU inference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-decision/config/requirements.lock.txt
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r ai-decision/config/requirements.lock.txt
      - name: Worker boundary tests
        working-directory: ai-decision
        run: python -m unittest discover -s tests -p test_service.py -v
      - name: Fetch and verify pinned model
        run: python scripts/ci/download_model.py "$RUNNER_TEMP/quyet-model"
      - name: Exercise all seven inference tasks
        working-directory: ai-decision
        env:
          QUYET_MODEL_DIR: ${{ runner.temp }}/quyet-model
          QUYET_CPU_THREADS: '2'
          PYTHONPATH: .
        run: python tests/smoke_production_worker.py
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (blocking)
        run: npm run lint
      - run: npm audit --audit-level=high
      - name: Type check and production build
        run: npm run build
  quality:
    name: Deployment guards and supply-chain checks
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: python3 scripts/ci/install_tools.py
      - name: Check Python release tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-venv"
          "$RUNNER_TEMP/quality-venv/bin/pip" install ruff==0.16.10
          "$RUNNER_TEMP/quality-venv/bin/ruff" check --isolated --select E4,E7,E9,F,I scripts ai-decision/scripts/build_runtime.py ai-decision/scripts/container_entrypoint.py
      - name: Validate workflows and deploy entrypoints
        run: |
          actionlint
          bash -n scripts/deploy.sh scripts/install-production-controls.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Scan dependencies and committed secrets
        run: |
          mkdir -p security-reports "$RUNNER_TEMP/worker-dependencies"
          cp ai-decision/config/requirements.lock.txt "$RUNNER_TEMP/worker-dependencies/requirements.txt"
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output security-reports/worker-dependencies.json "$RUNNER_TEMP/worker-dependencies"
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output security-reports/source.json --skip-dirs .git,.superpowers,frontend/node_modules,frontend/dist,backend/target .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-security-reports
          path: security-reports/
          retention-days: 14
  images:
    name: Production image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: quyet
            context: ai-decision
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: python3 scripts/ci/install_tools.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: danasea-ci-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}
      - name: Scan the actual production image
        env:
          IMAGE: danasea-ci-${{ matrix.service }}:${{ github.sha }}
        run: |
          mkdir -p security-reports
          trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output security-reports/image.json "$IMAGE"
          trivy image --image-src docker --format cyclonedx --output security-reports/sbom.cdx.json "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-${{ matrix.service }}
          path: security-reports/
          retention-days: 14
  gate:
    name: Required CI gate
    if: always()
    needs: [backend, worker, frontend, quality, images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            [[ "$result" == success ]] || exit 1
          done
